<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#004482" />
    <meta
      id="metaDescription"
      name="description"
      content="Day++ transforme un objectif long en progression quotidienne, hebdomadaire et annuelle."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Day++" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Day++</title>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-19ZNNEVK2R"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-19ZNNEVK2R");
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="icons/day-plus-plus-192.png"
    />
    <link rel="apple-touch-icon" href="icons/day-plus-plus-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="confettiCanvas" aria-hidden="true"></canvas>

    <div class="app-shell">
      <header class="topbar">
        <div class="title-block">
          <p class="eyebrow">Day++</p>
          <h1 id="periodTitle">Progression 365</h1>
          <p id="periodSubtitle" class="subtitle"></p>
        </div>
        <div class="top-actions">
          <button id="todayBtn" class="soft-button" type="button">
            <span data-i18n="action.today">Aujourd'hui</span>
          </button>
          <select id="languageSelect" class="language-select" aria-label="Langue">
            <option value="fr">Français</option>
            <option value="en">English</option>
          </select>
          <button
            id="settingsToggle"
            class="soft-button"
            type="button"
            aria-expanded="false"
            aria-controls="settingsPanel"
          >
            <span data-i18n="action.settings">Réglages</span>
          </button>
          <div class="more-actions">
            <button
              id="moreActionsBtn"
              class="soft-button menu-trigger"
              type="button"
              aria-expanded="false"
              aria-haspopup="menu"
              aria-controls="actionsMenu"
            >
              <span data-i18n="action.more">Plus</span>
            </button>
            <div id="actionsMenu" class="actions-menu" role="menu" hidden>
              <span id="offlineBadge" class="status-badge" hidden data-i18n="status.offline">Hors ligne</span>
              <button
                id="updateBtn"
                class="soft-button update-button"
                type="button"
                role="menuitem"
                hidden
              >
                <span data-i18n="action.update">Mettre à jour</span>
              </button>
              <button
                id="installBtn"
                class="soft-button install-button"
                type="button"
                role="menuitem"
                hidden
              >
                <span data-i18n="action.install">Installer</span>
              </button>
              <a id="guideLink" class="soft-button guide-button" href="guide.html" role="menuitem" data-i18n="action.guide">Guide</a>
              <button id="exportImageBtn" class="soft-button" type="button" role="menuitem">
                <span data-i18n="action.export">Exporter</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <main class="layout">
        <aside
          id="settingsPanel"
          class="settings-panel"
          aria-label="Réglages de la progression"
          data-i18n-aria-label="aria.settings"
        >
          <div class="progression-switcher">
            <label>
              <span data-i18n="settings.progression">Progression</span>
              <select id="progressSelect"></select>
            </label>
            <div class="progression-actions">
              <button id="newProgressBtn" class="ghost-button" type="button">
                <span data-i18n="action.new">Nouvelle</span>
              </button>
              <button id="deleteProgressBtn" class="ghost-button" type="button">
                <span data-i18n="action.delete">Supprimer</span>
              </button>
            </div>
          </div>
          <h2 data-i18n="settings.durationTitle">Durée</h2>
          <form id="settingsForm" class="settings-form">
            <label>
              <span data-i18n="settings.goal">Objectif</span>
              <input
                id="goalTitle"
                name="goalTitle"
                type="text"
                maxlength="42"
              />
            </label>
            <label>
              <span data-i18n="settings.type">Type</span>
              <select id="durationType" name="durationType">
                <option value="year" data-i18n="duration.year">Année</option>
                <option value="semester" data-i18n="duration.semester">Semestre</option>
                <option value="quarter" data-i18n="duration.quarter">Trimestre</option>
                <option value="month" data-i18n="duration.month">Mois</option>
                <option value="week" data-i18n="duration.week">Semaine</option>
              </select>
            </label>
            <label>
              <span data-i18n="settings.start">Début</span>
              <input id="startDate" name="startDate" type="date" />
            </label>
            <label>
              <span data-i18n="settings.end">Fin</span>
              <input id="endDate" name="endDate" type="date" />
            </label>
            <label>
              <span data-i18n="settings.mode">Mode</span>
              <select id="progressMode" name="progressMode">
                <option value="strict" data-i18n="mode.strict">Strict</option>
                <option value="flexible" data-i18n="mode.flexible">Souple</option>
              </select>
            </label>
            <label>
              <span data-i18n="settings.theme">Thème</span>
              <select id="themeSelect" name="themeSelect">
                <option value="primary" data-i18n="theme.primary">Principal</option>
                <option value="pink" data-i18n="theme.pink">Rose</option>
                <option value="green" data-i18n="theme.green">Vert</option>
                <option value="blue" data-i18n="theme.blue">Bleu</option>
                <option value="dark" data-i18n="theme.dark">Noir</option>
                <option value="sunset" data-i18n="theme.sunset">Sunset</option>
              </select>
            </label>
            <label class="toggle-label">
              <input
                id="notificationToggle"
                name="notificationToggle"
                type="checkbox"
              />
              <span data-i18n="settings.dailyReminder">Rappel quotidien</span>
            </label>
            <label>
              <span data-i18n="settings.reminderTime">Heure du rappel</span>
              <input
                id="notificationTime"
                name="notificationTime"
                type="time"
                value="09:00"
              />
            </label>
            <label class="toggle-label">
              <input
                id="vibrationToggle"
                name="vibrationToggle"
                type="checkbox"
              />
              <span data-i18n="settings.vibration">Vibration</span>
            </label>
            <button
              id="notificationPermissionBtn"
              class="ghost-button"
              type="button"
            >
              <span data-i18n="action.allowNotifications">Autoriser les notifications</span>
            </button>
            <p id="notificationStatus" class="settings-note" data-i18n="notification.disabled">
              Notifications désactivées
            </p>
            <div class="form-actions">
              <button class="primary-button" type="submit">
                <span data-i18n="action.apply">Appliquer</span>
              </button>
              <button id="currentYearBtn" class="ghost-button" type="button">
                <span data-i18n="action.currentYear">Année actuelle</span>
              </button>
            </div>
          </form>

          <div class="metric-list" aria-label="Résumé" data-i18n-aria-label="aria.summary">
            <div class="metric">
              <span class="metric-value" id="metricDone">0</span>
              <span class="metric-label" data-i18n="metric.done">jours faits</span>
            </div>
            <div class="metric">
              <span class="metric-value" id="metricTotal">365</span>
              <span class="metric-label" data-i18n="metric.total">jours prévus</span>
            </div>
            <div class="metric">
              <span class="metric-value" id="metricPercent">0%</span>
              <span class="metric-label" data-i18n="metric.progress">avancée</span>
            </div>
            <div class="metric">
              <span class="metric-value" id="metricStreak">0</span>
              <span class="metric-label" data-i18n="metric.streak">streak</span>
            </div>
            <div class="metric">
              <span class="metric-value" id="metricBestStreak">0</span>
              <span class="metric-label" data-i18n="metric.record">record</span>
            </div>
          </div>

          <div class="tool-stack" aria-label="Outils" data-i18n-aria-label="aria.tools">
            <button
              id="settingsExportImageBtn"
              class="ghost-button"
              type="button"
            >
              <span data-i18n="action.exportImage">Exporter l'image</span>
            </button>
            <button id="backupBtn" class="ghost-button" type="button">
              <span data-i18n="action.backup">Sauvegarder</span>
            </button>
            <button id="restoreBtn" class="ghost-button" type="button">
              <span data-i18n="action.restore">Restaurer</span>
            </button>
            <input
              id="restoreInput"
              type="file"
              accept="application/json"
              hidden
            />
          </div>

          <button id="resetProgressBtn" class="danger-button" type="button">
            <span data-i18n="action.reset">Réinitialiser cette durée</span>
          </button>
        </aside>

        <section class="workspace">
          <nav id="viewTabs" class="view-tabs" aria-label="Vues de progression" data-i18n-aria-label="aria.views">
            <button type="button" data-view="day" data-i18n="view.day">Jour</button>
            <button type="button" data-view="week" data-i18n="view.week">Semaine</button>
            <button type="button" data-view="month" data-i18n="view.month">Mois</button>
            <button type="button" data-view="quarter" data-i18n="view.quarter">Trimestre</button>
            <button type="button" data-view="semester" data-i18n="view.semester">Semestre</button>
            <button type="button" data-view="year" data-i18n="view.year">Année</button>
          </nav>

          <section id="viewHost" class="view-host" aria-live="polite"></section>
        </section>
      </main>
    </div>

    <div
      id="onboardingModal"
      class="onboarding-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="onboardingTitle"
    >
      <form id="onboardingForm" class="onboarding-card">
        <p class="eyebrow">Day++</p>
        <h2 id="onboardingTitle" data-i18n="onboarding.title">Configurer l'objectif</h2>
        <div class="onboarding-grid">
          <label>
            <span data-i18n="settings.goal">Objectif</span>
            <input
              id="onboardingGoalTitle"
              type="text"
              maxlength="42"
              value="Progression 365"
            />
          </label>
          <label>
            <span data-i18n="settings.durationTitle">Durée</span>
            <select id="onboardingDuration">
              <option value="year" data-i18n="duration.year">Année</option>
              <option value="semester" data-i18n="duration.semester">Semestre</option>
              <option value="quarter" data-i18n="duration.quarter">Trimestre</option>
              <option value="month" data-i18n="duration.month">Mois</option>
              <option value="week" data-i18n="duration.week">Semaine</option>
            </select>
          </label>
          <label>
            <span data-i18n="settings.start">Début</span>
            <input id="onboardingStart" type="date" />
          </label>
          <label>
            <span data-i18n="settings.end">Fin</span>
            <input id="onboardingEnd" type="date" />
          </label>
          <label>
            <span data-i18n="settings.mode">Mode</span>
            <select id="onboardingMode">
              <option value="strict" data-i18n="mode.strict">Strict</option>
              <option value="flexible" data-i18n="mode.flexible">Souple</option>
            </select>
          </label>
          <label>
            <span data-i18n="settings.theme">Thème</span>
            <select id="onboardingTheme">
              <option value="primary" data-i18n="theme.primary">Principal</option>
              <option value="pink" data-i18n="theme.pink">Rose</option>
              <option value="green" data-i18n="theme.green">Vert</option>
              <option value="blue" data-i18n="theme.blue">Bleu</option>
              <option value="dark" data-i18n="theme.dark">Noir</option>
              <option value="sunset" data-i18n="theme.sunset">Sunset</option>
            </select>
          </label>
        </div>
        <button class="primary-button" type="submit">
          <span data-i18n="action.start">Démarrer</span>
        </button>
      </form>
    </div>

    <script src="app.js"></script>
  </body>
</html>
